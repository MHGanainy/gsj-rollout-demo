# estate/compose.yaml — the demo estate, assembled (never reinvented):
# Forgejo and the MCP service are the library's own components as published
# images; the Polar leg is estate/polar.Dockerfile (ADR-0001 of this repo).
#
# NOTHING is published to host ports. Every service talks to every other by
# compose DNS name on `gsj-demo-net`, and episode containers join the same
# network (`runtime.network` in the generated rollout.yaml) — so the estate
# behaves identically on Linux, macOS, and hosts where docker-proxy port
# publishing is broken. To talk to the estate from outside, join the
# network:  docker run --rm --network gsj-demo-net <image> ...
#
# `bootstrap.py` drives this file with --env-file <work>/estate.env; the
# ${...} values below are written there. Run it via the bootstrap, not by
# hand — the bootstrap orders bring-up (Forgejo before the scaffold, the
# scaffold before MCP, the corpus before Polar) and generates the three
# mounted files (mcp-config.yaml, rollout.yaml, pins.gsj.json).

name: gsj-demo

services:
  forgejo:
    # The library's forgejo/ compose, minus its estate-bound lore: DNS name
    # instead of a static container IP, no published ports, same pinned
    # image, same headless-install switches.
    image: codeberg.org/forgejo/forgejo:16.0.2
    container_name: gsj-demo-forgejo
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"     # headless: no web wizard
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DISABLE_SSH: "true"        # HTTP-only estate
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__log__LEVEL: Warn
    volumes:
      - ${GSJ_DEMO_WORK:?run bootstrap.py, not compose directly}/forgejo-data:/data
    restart: unless-stopped

  mcp:
    # The library's mcp-service image, published. Its baked /app/config.yaml
    # carries the reference estate's values; the demo mounts its OWN config
    # over it (generated by the bootstrap from the corpus: the repo list is
    # the corpus's case ids). Same image bytes, different estate.
    image: ${GSJ_MCP_IMAGE:-ghcr.io/mhganainy/gsj-mcp-service:0.3.0}
    container_name: gsj-demo-mcp
    environment:
      # The :? guard is the F-22 lesson: the secret must fail at bring-up,
      # never mid-episode. The bootstrap generates it and states its home.
      GSJ_MCP_TOKEN_SECRET: ${GSJ_MCP_TOKEN_SECRET:?generate via bootstrap.py — it lives in <work>/secrets/mcp-token-secret}
    volumes:
      - ${GSJ_DEMO_WORK}/mcp-data:/app/data
      - ${GSJ_DEMO_WORK}/mcp-config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  polar-rollout:
    # Polar's central orchestrator. The topology is rendered by the library
    # (`gsj-rollout serve --render-only`) before this service starts.
    image: ${GSJ_POLAR_IMAGE:?run bootstrap.py, not compose directly}
    container_name: gsj-demo-polar-rollout
    command: polar serve_rollout -c /estate/topology.rendered.yaml
    volumes:
      - ${GSJ_DEMO_WORK}/estate:/estate
    restart: unless-stopped

  polar-gateway:
    # Polar's per-node gateway — the process that hosts gsj_rollout's
    # harness via import_path, mints the episode MCP tokens (hence the
    # secret), and starts episode containers. Those start as SIBLINGS on
    # the host daemon through the mounted socket (DockerRuntime shells out
    # to `docker create/start/exec/cp/rm` — measured, no bind-mount of
    # content our harness relies on).
    #
    # TMPDIR + the same-path sessions mount is the docker-outside-of-docker
    # path-identity trick: Polar mkdtemp()s a per-session dir under TMPDIR
    # and bind-mounts it into the episode container; with the host dir
    # mounted here at its own host path, the daemon-side mount resolves to
    # the same bytes — and session logs land host-visible for free.
    image: ${GSJ_POLAR_IMAGE}
    container_name: gsj-demo-polar-gateway
    command: polar serve_gateway -c /estate/topology.rendered.yaml
    environment:
      GSJ_MCP_TOKEN_SECRET: ${GSJ_MCP_TOKEN_SECRET:?generate via bootstrap.py}
      GSJ_PINS_PATH: /estate/pins.gsj.json
      TMPDIR: ${GSJ_DEMO_SESSIONS:?run bootstrap.py, not compose directly}
    volumes:
      - ${GSJ_DEMO_WORK}/estate:/estate
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GSJ_DEMO_SESSIONS}:${GSJ_DEMO_SESSIONS}
    extra_hosts:
      # Lets a host-local inference endpoint (127.0.0.1:...) be reached from
      # this container as host.docker.internal — the bootstrap rewrites the
      # config's localhost URL accordingly and says so.
      - host.docker.internal:host-gateway
    depends_on: [polar-rollout]
    restart: unless-stopped

  receiver:
    # The library's receiver (law 6's server leg): validates every trace at
    # the source against the SAME pins file the trainer leg will use.
    image: ${GSJ_POLAR_IMAGE}
    container_name: gsj-demo-receiver
    command: gsj-rollout serve --config /estate/rollout.yaml
    environment:
      GSJ_PINS_PATH: /estate/pins.gsj.json
    volumes:
      - ${GSJ_DEMO_WORK}/estate:/estate
      - ${GSJ_DEMO_WORK}/traces:/estate/traces
    restart: unless-stopped

networks:
  default:
    name: gsj-demo-net
