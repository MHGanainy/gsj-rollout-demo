# estate/compose.yaml — the demo estate's POLAR LEG, assembled (never
# reinvented): three containers of one published image (estate/polar.Dockerfile,
# ADR-0001 of this repo) — Polar's rollout server, Polar's gateway, and the
# library's receiver.
#
# Forgejo and the retrieval service are NOT here since library 0.1.3 (CP-61):
# `bootstrap.py up` stands them up through the library's own bring-up
# (`python -m gsj_rollout.estate`), whose compose project is `gsj-demo`
# (containers gsj-demo-forgejo / gsj-demo-mcp, published on 127.0.0.1 host
# ports of its choosing) and whose docker network is `gsj-demo-net`. This
# file JOINS that network (external) under its own project name, so the two
# compose projects never `down` each other. Episode containers join the same
# network (`runtime.network` in the generated rollout.yaml). The Polar leg
# publishes NO host ports: to talk to it from outside, join the network —
# docker run --rm --network gsj-demo-net <image> ...
#
# `bootstrap.py` drives this file with two --env-file flags: work/polar.env
# (the values below) and work/runs/demo/.env (the bring-up's secrets, KEY='value'
# — compose's dotenv parser strips the quotes; `docker run --env-file` would
# not). Run it via the bootstrap, not by hand — the bootstrap generates the
# three mounted files (pins.gsj.json, rollout.yaml, topology.rendered.yaml)
# and recreates the services when they change.

name: gsj-demo-polar

services:
  polar-rollout:
    # Polar's central orchestrator. The topology is rendered by the library
    # (`gsj-rollout serve --render-only`, in this image) before this service
    # starts.
    image: ${GSJ_POLAR_IMAGE:?run bootstrap.py, not compose directly}
    container_name: gsj-demo-polar-rollout
    command: polar serve_rollout -c /estate/topology.rendered.yaml
    volumes:
      - ${GSJ_DEMO_WORK:?run bootstrap.py, not compose directly}/estate:/estate
    restart: unless-stopped

  polar-gateway:
    # Polar's per-node gateway — the process that hosts gsj_rollout's
    # harness via import_path, mints the episode MCP tokens (hence the
    # secret), and starts episode containers. Those start as SIBLINGS on
    # the host daemon through the mounted socket (DockerRuntime shells out
    # to `docker create/start/exec/cp/rm` — measured, no bind-mount of
    # content our harness relies on).
    #
    # TMPDIR + the same-path sessions mount is the docker-outside-of-docker
    # path-identity trick: Polar mkdtemp()s a per-session dir under TMPDIR
    # and bind-mounts it into the episode container; with the host dir
    # mounted here at its own host path, the daemon-side mount resolves to
    # the same bytes — and session logs land host-visible for free.
    #
    # The read token (estate.clone_credential_env in rollout.yaml) is NOT
    # needed here: the library splices it into the clone URL in the
    # SUBMITTING process (CP-56), and the harness strips it from the trace.
    image: ${GSJ_POLAR_IMAGE}
    container_name: gsj-demo-polar-gateway
    command: polar serve_gateway -c /estate/topology.rendered.yaml
    environment:
      # The :? guard is the F-22 lesson: the secret must fail at bring-up,
      # never mid-episode. The bring-up minted it into work/runs/demo/.env.
      GSJ_MCP_TOKEN_SECRET: ${GSJ_MCP_TOKEN_SECRET:?the bring-up's .env carries it — run bootstrap.py, not compose directly}
      GSJ_PINS_PATH: /estate/pins.gsj.json
      TMPDIR: ${GSJ_DEMO_SESSIONS:?run bootstrap.py, not compose directly}
    volumes:
      - ${GSJ_DEMO_WORK}/estate:/estate
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GSJ_DEMO_SESSIONS}:${GSJ_DEMO_SESSIONS}
    extra_hosts:
      # Lets a host-local inference endpoint (127.0.0.1:...) be reached from
      # this container as host.docker.internal — the bootstrap rewrites the
      # config's localhost URL accordingly and says so.
      - host.docker.internal:host-gateway
    depends_on: [polar-rollout]
    restart: unless-stopped

  receiver:
    # The library's receiver (law 6's server leg): validates every trace at
    # the source against the SAME pins file the trainer leg will use.
    #
    # Its config is a byte-copy in its own directory: `gsj-rollout serve`
    # re-renders topology.rendered.yaml beside its config at every start, and
    # Polar's two containers read the one the bootstrap rendered under
    # /estate — so the receiver's re-render never aliases that file. (The
    # receiver's log also prints the library's "run Polar's two processes
    # yourself" block on start: not for you — those two are the containers
    # beside it.)
    image: ${GSJ_POLAR_IMAGE}
    container_name: gsj-demo-receiver
    command: gsj-rollout serve --config /receiver/rollout.yaml
    environment:
      GSJ_PINS_PATH: /estate/pins.gsj.json
    volumes:
      - ${GSJ_DEMO_WORK}/estate:/estate
      - ${GSJ_DEMO_WORK}/estate/receiver:/receiver
      - ${GSJ_DEMO_WORK}/traces:/estate/traces
    restart: unless-stopped

networks:
  default:
    # the bring-up's network — created by `python -m gsj_rollout.estate up`
    # (compose project gsj-demo) before this file is ever used
    name: gsj-demo-net
    external: true
